<!-- GUÍA: ¡Bienvenidos a nuestra segunda lección! 
     Aquí aprenderemos a crear la estructura básica de una página web.
     Recuerda que HTML es como el esqueleto o los cimientos de una casa. -->

<!-- PASO 1: Escribe la etiqueta principal que envuelve todo el documento HTML -->
<!-- Pista: Empieza con <... > y cierra con </... > -->
<html>

  <!-- PASO 2: Escribe la sección invisible (la "cabeza") donde va la información oculta de la página, como el título de la pestaña -->
  <head>
    <!-- Escribe aquí el título que aparecerá en la pestaña del navegador -->
    <title>Mi Primera Página Web</title>
  </head>

  <!-- PASO 3: Escribe la sección visible (el "cuerpo") donde irá todo el contenido que las personas podrán ver -->
  <body>

    <!-- PASO 4: Añade un título principal (la etiqueta más grande de encabezado) con un texto de bienvenida -->
    <!-- Pista: Usa la etiqueta h1 -->
    <h1>¡Hola, mundo! Bienvenidos a mi perfil</h1>

    <!-- PASO 5: Añade un párrafo de texto explicando qué es esta página web -->
    <!-- Pista: Usa la etiqueta p -->
    <p>Estoy aprendiendo a crear páginas web desde cero usando HTML en CodePen. ¡Es muy divertido!</p>

  </body>
</html>
